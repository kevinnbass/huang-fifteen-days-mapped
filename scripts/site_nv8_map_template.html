<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fifteen Days, Mapped</title>
<style>
/* Layout: the figure itself is the page. It lies on a table like a sheet map: drag it, zoom it, and click anything on it; a narrow
   panel at the side holds the record behind whatever was clicked. The sheet keeps the figure's own paper and inks in both themes;
   only the table and the panel follow the viewer's theme. */
:root {
  --table: #dedad0; --surface: #fffdf8; --sunk: #efece4; --ink: #191b1a; --muted: #5f6259; --rule: #cfccc1;
  --link: #1d5cae; --mark: #191b1a; --flag: #8a5a00; --paper: #f7f4ee; --paper-ink: #191b1a;
  --sans: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --table: #0c0e0c; --surface: #1c1f1d; --sunk: #262a27; --ink: #ecebe4; --muted: #a4a79c; --rule: #363a36;
    --link: #93bdf3; --mark: #ecebe4; --flag: #e0b25a; color-scheme: dark }
}
:root[data-theme="dark"] { --table: #0c0e0c; --surface: #1c1f1d; --sunk: #262a27; --ink: #ecebe4; --muted: #a4a79c; --rule: #363a36;
  --link: #93bdf3; --mark: #ecebe4; --flag: #e0b25a; color-scheme: dark }
[hidden] { display: none !important }
html, body { height: 100% }
body { margin: 0; background: var(--table); color: var(--ink); font: 14px/1.45 var(--sans); overflow: hidden }
.app, .app * { box-sizing: border-box }
.app { height: 100%; display: flex; flex-direction: column; min-height: 0 }
.app button, .app input { font: inherit; color: inherit }
.app :focus-visible { outline: 2px solid var(--link); outline-offset: 1px }
.app p, .app ul, .app h2, .app h3, .app h4, .app blockquote { margin: 0 }
.app ul { padding: 0; list-style: none }
.app a { color: var(--link); text-underline-offset: 2px }
.app code { font: 0.92em var(--mono); overflow-wrap: anywhere }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%) }

.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--surface); border-bottom: 1px solid var(--rule) }
.brand { display: flex; flex-direction: column; line-height: 1.15; min-width: 0 }
.brand strong { font-size: 17px; letter-spacing: -0.01em }
.brand span { font-size: 10.5px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted) }
.jump { flex: 1 1 220px; max-width: 360px; min-width: 0 }
.jump input { width: 100%; padding: 6px 10px; border: 1px solid var(--rule); border-radius: 4px; background: var(--table) }
.tools { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto }
.btn { border: 1px solid var(--rule); background: var(--surface); border-radius: 4px; padding: 5px 10px; cursor: pointer; white-space: nowrap }
.btn:hover { background: var(--sunk) }
.app a.btn { color: inherit; text-decoration: none; display: inline-block; line-height: inherit }
.btn.sq { min-width: 34px; font-weight: 700 }

.stage { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 390px }
.view { position: relative; overflow: hidden; touch-action: none; cursor: grab; background: var(--table); outline-offset: -2px; min-height: 0 }
.view.drag { cursor: grabbing }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; box-shadow: 0 2px 22px rgba(0, 0, 0, 0.28) }
.world.fly { transition: transform 0.5s cubic-bezier(0.2, 0.7, 0.2, 1) }
@media (prefers-reduced-motion: reduce) { .world.fly { transition: none } }
.world .chip, .world .row, .world circle, .world .e { cursor: pointer }
.world .e, .world .eh { pointer-events: stroke }
.world .eh { cursor: pointer; fill: none }
.labels { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.2s }
.view.far .labels { opacity: 1 }
.app button.rlabel { position: absolute; pointer-events: none; border: 0; background: rgba(25, 27, 26, 0.88); color: #f7f4ee; font: 700 calc(14.5px * var(--inv, 1))/1.1 "Helvetica Neue", Helvetica, Arial, sans-serif; padding: calc(6px * var(--inv, 1)) calc(11px * var(--inv, 1)); border-radius: calc(8px * var(--inv, 1)); cursor: pointer; transform: translate(-50%, -50%); white-space: nowrap; text-align: center }
.app button.rlabel small { display: block; color: #f7f4ee; font-weight: 400; font-size: calc(11px * var(--inv, 1)); opacity: 0.85; margin-top: calc(2px * var(--inv, 1)) }
.app .view.far button.rlabel { pointer-events: auto }
.sel { position: absolute; border: 5px solid #191b1a; border-radius: 12px; pointer-events: none; box-shadow: 0 0 0 5px rgba(247, 244, 238, 0.9) }
.tip { position: absolute; z-index: 3; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 12.5px; line-height: 1.35; padding: 6px 9px; border-radius: 4px; max-width: 340px }
.tip b { display: block; font-weight: 700 }
.tip span { display: block }
.tip i { display: block; font-style: normal; opacity: 0.72; font-size: 11.5px; margin-top: 3px }
.world [data-node] { cursor: pointer }
.app button.linkbtn { border: 0; background: none; color: var(--link); padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; font-size: 12.5px; text-align: left; width: fit-content }
.heads { display: flex; flex-direction: column; gap: 6px; font-size: 13px }
.heads li { overflow-wrap: anywhere }
.days { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px }
.days .btn { padding: 4px 2px; font-size: 12px; text-align: center; white-space: normal; line-height: 1.25 }
.days .btn small { display: block; color: var(--muted); font-size: 11px }
.mini { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); width: 112px; border: 1px solid var(--rule); background: #f7f4ee; cursor: crosshair; z-index: 2; line-height: 0; box-shadow: 0 1px 8px rgba(0, 0, 0, 0.25); touch-action: none }
.mini img { width: 100%; height: auto; display: block; pointer-events: none }
.minirect { position: absolute; border: 2px solid #c8321e; background: rgba(200, 50, 30, 0.12); pointer-events: none; min-width: 4px; min-height: 4px }
.hint { position: absolute; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 2; background: var(--ink); color: var(--surface); padding: 6px 12px; border-radius: 16px; font-size: 12.5px; white-space: nowrap; max-width: calc(100% - 150px); overflow: hidden; text-overflow: ellipsis; transition: opacity 0.4s }
.hint.gone { opacity: 0 }

.panel { background: var(--surface); border-left: 1px solid var(--rule); overflow-y: auto; min-height: 0; padding: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px }
.panel h2 { font-size: 20px; line-height: 1.15; letter-spacing: -0.01em; text-wrap: balance }
.panel h4 { font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted) }
.panel .role, .panel .muted { color: var(--muted) }
.panel .lead { font-size: 15px }
.panel .rule { font-weight: 700 }
.list { display: flex; flex-direction: column; gap: 8px }
.act { background: var(--table); border: 1px solid var(--rule); border-radius: 5px; padding: 9px 11px; display: flex; flex-direction: column; gap: 5px }
.act.rep { border-left: 3px dashed var(--mark) }
.act.on { border-color: var(--mark); box-shadow: 0 0 0 1px var(--mark) }
.when { font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums }
.flag { font-size: 12.5px; color: var(--flag) }
details.src { font-size: 13px }
details.src summary, .panel details > summary { cursor: pointer; color: var(--link); width: fit-content }
details.src ul { margin-top: 6px; display: flex; flex-direction: column; gap: 8px }
details.src li { display: flex; flex-direction: column; gap: 3px; overflow-wrap: anywhere }
.dom { color: var(--muted) }
.app blockquote { border-left: 2px solid var(--rule); padding-left: 9px; color: var(--muted) }
.tie { border-top: 1px solid var(--rule); padding-top: 8px; display: flex; flex-direction: column; gap: 4px }
.kind { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted) }
.notshown { border-left: 3px solid var(--mark); padding-left: 12px }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chips .btn { padding: 3px 8px; font-size: 13px }
.status { border-left: 3px solid var(--mark); padding-left: 12px; display: flex; flex-direction: column; gap: 6px; font-size: 13.5px }
.small { font-size: 12.5px; color: var(--muted) }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13px }
.keys b { font-weight: 700; white-space: nowrap }
@media (max-width: 820px) {
  .stage { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 42%) }
  .panel { border-left: 0; border-top: 1px solid var(--rule); padding-left: max(16px, env(safe-area-inset-left, 0px)) }
  .mini { width: 70px }
  .hint { display: none }
  .tools .btn.wide { display: none }
}
__FIGSTYLE__
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><span id="kicker"></span><strong>Fifteen days, mapped</strong></div>
    <div class="jump">
      <label class="vh" for="jump">Jump to an actor, a group, a box or a day</label>
      <input id="jump" type="search" list="jumplist" autocomplete="off" placeholder="Jump to an actor, a group, a box or a day">
      <datalist id="jumplist"></datalist>
    </div>
    <div class="tools">
      <button class="btn sq" id="zout" type="button" aria-label="Zoom out">&minus;</button>
      <button class="btn sq" id="zin" type="button" aria-label="Zoom in">+</button>
      <button class="btn" id="fit" type="button">Whole map</button>
      <button class="btn wide" id="tonotes" type="button">Notes on the map</button>
      <button class="btn" id="about" type="button">Status</button>
      <a class="btn" id="repo" hidden target="_blank" rel="noopener noreferrer">Repository</a>
    </div>
  </header>
  <div class="stage">
    <div class="view" id="view" tabindex="0" role="application" aria-label="The figure as a map. Arrow keys move it, plus and minus zoom, zero shows the whole map.">
      <div class="world" id="world">__FIGURE__<div class="labels" id="labels"></div><div class="sel" id="sel" hidden></div></div>
      <div class="tip" id="tip" hidden></div>
      <div class="mini" id="mini" aria-hidden="true"><img alt="" src="__THUMB__"><div class="minirect" id="minirect"></div></div>
      <p class="hint" id="hint">Scroll or pinch to zoom &middot; drag to move &middot; click a name on the map to go there &middot; hover anything for what it is &middot; click a dot, a chip, a row, a line or a box for its record</p>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
</div>
<script type="application/json" id="data">__DATA__</script>
